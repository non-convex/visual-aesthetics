<text x="44" y="44" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#5c626b">视觉关系  08</text>
<text x="44" y="89" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202329">循环要看接缝附近，不只看首尾位置</text>
<text x="44" y="123" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5c626b">横轴为时间，纵轴为位置。每段虚线处是一次循环边界。</text>
<text x="44" y="250" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#202329">位置与速度都接上</text>
