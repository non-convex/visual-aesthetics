<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="960" viewBox="0 0 1340 960" role="img"><title>循环要看接缝附近，不只看首尾位置</title><desc>横轴为时间，纵轴为位置。每段虚线处是一次循环边界。</desc>
