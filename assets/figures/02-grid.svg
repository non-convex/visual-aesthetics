<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img"><title>六栏是位置参照，不是六条正文</title><desc>画布宽 1200；左右边距各 72；栏距 24；单栏宽 156。</desc>
<rect width="100%" height="100%" fill="#fff"/>
<text x="44" y="44" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#5c626b">视觉关系  02</text>
<text x="44" y="89" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202329">六栏是位置参照，不是六条正文</text>
<text x="44" y="123" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5c626b">画布宽 1200；左右边距各 72；栏距 24；单栏宽 156。</text>
<rect x="40" y="190" width="1200" height="612" fill="#ffffff" stroke="#c5cbd2" stroke-width="1"/>
<rect x="112" y="190" width="156" height="612" fill="#eef1f4"/>
<text x="190" y="224" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#5c626b">1</text>
<rect x="292" y="190" width="156" height="612" fill="#eef1f4"/>
<text x="370" y="224" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#5c626b">2</text>
<rect x="472" y="190" width="156" height="612" fill="#eef1f4"/>
<text x="550" y="224" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#5c626b">3</text>
<rect x="652" y="190" width="156" height="612" fill="#eef1f4"/>
<text x="730" y="224" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#5c626b">4</text>
<rect x="832" y="190" width="156" height="612" fill="#eef1f4"/>
<text x="910" y="224" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#5c626b">5</text>
<rect x="1012" y="190" width="156" height="612" fill="#eef1f4"/>
<text x="1090" y="224" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#5c626b">6</text>
<line x1="40" y1="160" x2="40" y2="182" stroke="#202329" stroke-width="1"/>
<line x1="112" y1="160" x2="112" y2="182" stroke="#202329" stroke-width="1"/>
<line x1="1168" y1="160" x2="1168" y2="182" stroke="#202329" stroke-width="1"/>
<line x1="1240" y1="160" x2="1240" y2="182" stroke="#202329" stroke-width="1"/>
<line x1="40" y1="169" x2="1240" y2="169" stroke="#202329" stroke-width="1"/>
<text x="640" y="160" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#5c626b">总宽 1200</text>
<text x="76" y="265" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#5c626b">72</text>
<text x="1204" y="265" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#5c626b">72</text>
<rect x="112" y="250" width="516" height="90" fill="#202329"/>
<text x="132" y="305" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#ffffff">三栏跨度 516</text>
<rect x="652" y="250" width="516" height="90" fill="#ffffff" stroke="#202329" stroke-width="2"/>
<text x="672" y="305" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#202329">三栏跨度 516</text>
<rect x="112" y="380" width="696" height="150" fill="#202329"/>
<text x="132" y="435" font-family="Noto Sans CJK SC, sans-serif" font-size="26" font-weight="400" text-anchor="start" fill="#ffffff">四栏主图 696</text>
<rect x="832" y="380" width="336" height="150" fill="#ffffff" stroke="#202329" stroke-width="2"/>
<text x="852" y="430" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#202329">两栏说明 336</text>
<line x1="853" y1="453" x2="1120" y2="453" stroke="#c5cbd2" stroke-width="3"/>
<line x1="853" y1="469" x2="1120" y2="469" stroke="#c5cbd2" stroke-width="3"/>
<line x1="853" y1="485" x2="1120" y2="485" stroke="#c5cbd2" stroke-width="3"/>
<line x1="853" y1="501" x2="1120" y2="501" stroke="#c5cbd2" stroke-width="3"/>
<rect x="112" y="570" width="336" height="185" fill="#ffffff" stroke="#202329" stroke-width="2"/>
<text x="130" y="617" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202329">两栏图像</text>
<rect x="472" y="570" width="696" height="185" fill="#ffffff" stroke="#202329" stroke-width="2"/>
<text x="494" y="617" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#202329">四栏宽度可容纳连续正文</text>
<line x1="495" y1="645" x2="1130" y2="645" stroke="#c5cbd2" stroke-width="3"/>
<line x1="495" y1="661" x2="1073" y2="661" stroke="#c5cbd2" stroke-width="3"/>
<line x1="495" y1="677" x2="1016" y2="677" stroke="#c5cbd2" stroke-width="3"/>
<line x1="495" y1="693" x2="1130" y2="693" stroke="#c5cbd2" stroke-width="3"/>
<line x1="495" y1="709" x2="1073" y2="709" stroke="#c5cbd2" stroke-width="3"/>
<text x="112" y="850" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#202329">跨 k 栏的宽度 = k × 156 + (k − 1) × 24</text>
<line x1="44" y1="879" x2="1236" y2="879" stroke="#c5cbd2" stroke-width="1"/>
<text x="44" y="912" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#5c626b">选择内容跨度，再判断阅读、图像比例和空隙；这些数字只属于这次示例。</text>
</svg>