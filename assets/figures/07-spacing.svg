<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850" role="img"><title>相同总时长，不同位移间距</title><desc>每行标出 t = 0、0.25、0.5、0.75、1 的位置；位置范围均为 0—100。</desc>
<rect width="100%" height="100%" fill="#fff"/>
<text x="44" y="44" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#5c626b">视觉关系  07</text>
<text x="44" y="89" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#202329">相同总时长，不同位移间距</text>
<text x="44" y="123" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5c626b">每行标出 t = 0、0.25、0.5、0.75、1 的位置；位置范围均为 0—100。</text>
<text x="44" y="222" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202329">匀速</text>
<text x="44" y="258" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5c626b">x = 100t</text>
<line x1="375" y1="230" x2="1230" y2="230" stroke="#c5cbd2" stroke-width="1"/>
<circle cx="375.0" cy="230" r="12" fill="#202329"/>
<text x="375.0" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">0</text>
<circle cx="588.75" cy="230" r="12" fill="#202329"/>
<text x="588.75" y="291" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">1</text>
<circle cx="802.5" cy="230" r="12" fill="#202329"/>
<text x="802.5" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">2</text>
<circle cx="1016.25" cy="230" r="12" fill="#202329"/>
<text x="1016.25" y="291" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">3</text>
<circle cx="1230.0" cy="230" r="12" fill="#202329"/>
<text x="1230.0" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">4</text>
<text x="375" y="327" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5c626b">位置：0   /   25   /   50   /   75   /   100</text>
<text x="44" y="416" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202329">越来越快</text>
<text x="44" y="452" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5c626b">x = 100t²</text>
<line x1="375" y1="424" x2="1230" y2="424" stroke="#c5cbd2" stroke-width="1"/>
<circle cx="375.0" cy="424" r="12" fill="#202329"/>
<text x="375.0" y="462" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">0</text>
<circle cx="428.4375" cy="424" r="12" fill="#202329"/>
<text x="428.4375" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">1</text>
<circle cx="588.75" cy="424" r="12" fill="#202329"/>
<text x="588.75" y="462" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">2</text>
<circle cx="855.9375" cy="424" r="12" fill="#202329"/>
<text x="855.9375" y="485" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">3</text>
<circle cx="1230.0" cy="424" r="12" fill="#202329"/>
<text x="1230.0" y="462" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">4</text>
<text x="375" y="521" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5c626b">位置：0   /   6.25   /   25   /   56.25   /   100</text>
<text x="44" y="610" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#202329">逐渐落定</text>
<text x="44" y="646" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#5c626b">x = 100(2t − t²)</text>
<line x1="375" y1="618" x2="1230" y2="618" stroke="#c5cbd2" stroke-width="1"/>
<circle cx="375.0" cy="618" r="12" fill="#202329"/>
<text x="375.0" y="656" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">0</text>
<circle cx="749.0625" cy="618" r="12" fill="#202329"/>
<text x="749.0625" y="679" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">1</text>
<circle cx="1016.25" cy="618" r="12" fill="#202329"/>
<text x="1016.25" y="656" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">2</text>
<circle cx="1176.5625" cy="618" r="12" fill="#202329"/>
<text x="1176.5625" y="679" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">3</text>
<circle cx="1230.0" cy="618" r="12" fill="#202329"/>
<text x="1230.0" y="656" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#202329">4</text>
<text x="375" y="715" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5c626b">位置：0   /   43.75   /   75   /   93.75   /   100</text>
<line x1="44" y1="789" x2="1276" y2="789" stroke="#c5cbd2" stroke-width="1"/>
<text x="44" y="822" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#5c626b">编号 0—4 是等时间采样；点与点的距离表达这一小段走了多远，不是帧率建议。</text>
</svg>